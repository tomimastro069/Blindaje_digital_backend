spring:
  application:
    name: blindaje-digital

  datasource:
    url: jdbc:postgresql://postgres:5432/blindaje
    username: blindaje
    password: blindaje
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:blindaje-digital-secret-key-local-development-only-32chars}
  expiration: 86400000